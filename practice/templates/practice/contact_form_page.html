{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}

<section class="py-5">
  <div class="container">
    <h1>{{ page.title }}</h1>
    {{ page.intro|richtext }}
    
    <form action="{% pageurl page %}" method="POST" class="row g-3 mt-4">
      {% csrf_token %}
      
      {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-danger">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}
      
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </div>
</section>

{% endblock %}
